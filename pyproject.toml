[project]
name = "picture-book-cli"
version = "1.0.0"
description = "Picture Book CLI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.1",
    "pillow>=12.2.0",
    "platformdirs>=4.9.6",
]

[project.scripts]
picture-book = "main:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["main.py"]
